name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump version
        id: bump
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r major minor patch <<< "$VERSION"
          case "${{ inputs.bump }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "$NEW_VERSION" > VERSION
          echo "old_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        run: |
          BRANCH="chore/bump-v${{ steps.bump.outputs.new_version }}"
          PR_BODY=$(mktemp)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION
          git commit -m "bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin "$BRANCH"
          {
            printf '## Why\n\nPrepare the next release version.\n\n'
            printf '## What changed\n\nBump `VERSION` from `%s` to `%s` (%s).\n\n' \
              '${{ steps.bump.outputs.old_version }}' \
              '${{ steps.bump.outputs.new_version }}' \
              '${{ inputs.bump }}'
            printf '## Compatibility\n\nNo CLI, output, schema, or transport-stream compatibility impact.\n\n'
            printf '## Documentation\n\n`README.md`, `OPTIONS.md`, and `docs/json-schema-v1.json` are unchanged because this PR only updates the release version.\n\n'
            printf '## Validation\n\n- The version was derived from the existing `VERSION` value.\n- The documentation-policy check runs on this PR.\n'
          } > "$PR_BODY"
          gh pr create \
            --title "bump version to ${{ steps.bump.outputs.new_version }}" \
            --body-file "$PR_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
