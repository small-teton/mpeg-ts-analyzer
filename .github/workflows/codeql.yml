name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 UTC

# A newer push to a pull request cancels the run it supersedes; the newer run
# reports the same checks on the new head commit. Pushes to master and
# scheduled runs each get their own group (the run ID), so they are never
# cancelled or dropped from the queue.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.ref) || format('codeql-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.filter.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed languages
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          go=true
          rust=true
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          # Scheduled and unknown-base runs analyze both languages. Otherwise,
          # keep the existing analyze job identity but narrow its matrix.
          if [ "$EVENT_NAME" != schedule ] && [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" HEAD)
            # Here-strings, not pipes: with pipefail, grep -q exiting at the
            # first match could fail the upstream printf with SIGPIPE.
            grep -Eq '(\.go$|^go\.(mod|sum)$|^\.github/workflows/codeql\.yml$)' \
              <<<"$files" || go=false
            grep -Eq '(^gui/.*\.rs$|^gui/Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.github/workflows/codeql\.yml$)' \
              <<<"$files" || rust=false
          fi

          # The Rust analysis takes several minutes and is not a required
          # check, so pull requests skip it; pushes to master and the weekly
          # run analyze Rust.
          if [ "$EVENT_NAME" = pull_request ]; then
            rust=false
          fi

          languages=""
          if [ "$go" = true ]; then
            languages='"go"'
          fi
          if [ "$rust" = true ]; then
            languages="${languages:+$languages,}\"rust\""
          fi
          echo "languages=[$languages]" >> "$GITHUB_OUTPUT"

  # Keep this job id and the categories stable: GitHub identifies a code-
  # scanning configuration by workflow, job id and category together.
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"

      - name: Install the toolchain from rust-toolchain.toml
        if: matrix.language == 'rust'
        working-directory: gui
        run: rustup toolchain install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'go'
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
