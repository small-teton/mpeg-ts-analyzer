name: Dependency review

# Rejects pull requests that add a dependency version with a known advisory.
# It compares the dependency graph of the base and head (go.mod, gui/Cargo.lock,
# GitHub Actions), so it only judges what the pull request changes; the
# scheduled govulncheck and cargo audit runs cover advisories published later
# against unchanged dependencies.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
    - name: Dependency review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: low
        comment-summary-in-pr: never
