name: goreleaser

on:
  push:
    # Only run for well-formed version tags. A malformed tag such as "v.1.5.0"
    # would otherwise start a run that goreleaser aborts as invalid semver.
    # This trigger covers tags pushed by a user (e.g. `make release`); the
    # Release workflow releases its own tag inline instead.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
      -
        # GUI releases use gui-v* tags on the same branch. Name the CLI tags so
        # GoReleaser does not take a GUI tag as the current or previous release.
        name: Pick the CLI tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "GORELEASER_CURRENT_TAG=$TAG" >> "$GITHUB_ENV"
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          fi
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
