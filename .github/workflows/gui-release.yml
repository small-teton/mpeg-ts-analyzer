name: GUI release

# Packages the GUI for macOS (.dmg), Linux (.deb, AppImage) and Windows (NSIS
# installer, portable zip) with the published CLI release named in
# gui/BUNDLED_CLI_VERSION (verified against its checksums and build
# provenance), checks that each package finds that CLI, and publishes them with
# checksums, an SBOM, build provenance and a manifest of both versions.
# The update packages (.app.tar.gz, AppImage, NSIS installer) are also signed
# for the GUI's in-app update, with the key of the gui-release environment, and
# published with their signatures and an update manifest.
#
# - workflow_dispatch on master releases gui-v<version of gui/Cargo.toml>. The
#   tag is created at the built commit only after every package has passed its
#   checks, in the publishing job (a tag pushed with GITHUB_TOKEN would not
#   start another run).
# - A gui-v* tag pushed by a user releases that tag.
# - A rerun continues when the tag already points at the built commit and no
#   published release exists, and stops without changes when the release is
#   published. A tag at another commit fails the run; tags are never moved or
#   deleted. Release runs never run concurrently or get cancelled.
# - A pull request that changes the packaging builds and checks the packages
#   without publishing them. A change to gui/Cargo.toml builds the packages
#   unless it only touches dev-dependencies, or optional dependencies and
#   features that the default features do not enable; those, and Cargo.lock
#   changes, only check the third-party notices. Pull requests
#   restore the cargo tools from a cache; releases always build them.
# CLI releases use v* tags and are not started by gui-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "gui-v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - rust-toolchain.toml
      - gui/Cargo.toml
      - gui/Cargo.lock
      - gui/assets/icons/**
      - gui/about.hbs
      - gui/about.toml
      - gui/scripts/third-party-notices.sh
      - gui/scripts/sign-macos-app.sh
      - gui/src/cli.rs
      - gui/src/main.rs
      - gui/BUNDLED_CLI_VERSION
      - VERSION
      - .github/scripts/release-state.sh
      - .github/scripts/bundled-cli.sh
      - .github/scripts/go-third-party-notices.sh
      - .github/scripts/sign-gui-updates.sh
      - gui/updater.pub
      - .github/gui-release-notes.md
      - .github/workflows/gui-release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gui-release-pr-{0}', github.ref) || 'gui-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=crate depName=cargo-packager
  CARGO_PACKAGER_VERSION: 0.11.8
  # renovate: datasource=crate depName=cargo-cyclonedx
  CARGO_CYCLONEDX_VERSION: 0.5.9
  # renovate: datasource=crate depName=cargo-about
  CARGO_ABOUT_VERSION: 0.9.3

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      state: ${{ steps.version.outputs.state }}
      cli-version: ${{ steps.version.outputs.cli-version }}
      package: ${{ steps.scope.outputs.package }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Decide whether to build the packages
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT_NAME" != pull_request ]; then
          echo "package=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$BASE_SHA" HEAD)
        package=false
        # Here-strings, not pipes: with pipefail, grep -q exiting at the first
        # match could fail the upstream printf with SIGPIPE.
        if grep -Eq '^(rust-toolchain\.toml$|gui/assets/icons/|gui/about\.(hbs|toml)$|gui/scripts/(third-party-notices|sign-macos-app)\.sh$|gui/src/(cli|main)\.rs$|gui/BUNDLED_CLI_VERSION$|gui/updater\.pub$|VERSION$|\.github/scripts/(release-state|bundled-cli|go-third-party-notices|sign-gui-updates)\.sh$|\.github/gui-release-notes\.md$|\.github/workflows/gui-release\.yml$)' \
          <<<"$files"; then
          package=true
        elif grep -qx gui/Cargo.toml <<<"$files"; then
          git show "$BASE_SHA:gui/Cargo.toml" > "$RUNNER_TEMP/base-Cargo.toml"
          # Compares the manifest without what cannot reach the packages:
          # dev-dependencies, and optional dependencies and features that the
          # default features do not enable. Everything else counts, including
          # [package], profiles, targets and build-dependencies.
          if python3 - "$RUNNER_TEMP/base-Cargo.toml" gui/Cargo.toml <<'EOF'
        import sys, tomllib

        def shipped(path):
            with open(path, "rb") as f:
                manifest = tomllib.load(f)
            features = manifest.pop("features", {})
            enabled, active, pending = set(), set(), ["default"]
            while pending:
                name = pending.pop()
                if name in enabled:
                    continue
                enabled.add(name)
                for item in features.get(name, []):
                    head, _, _ = item.partition("/")
                    if head.endswith("?"):
                        continue  # "dep?/feature" does not enable the dependency
                    head = head.removeprefix("dep:")
                    active.add(head)
                    pending.append(head)
            manifest["features"] = {name: features[name] for name in enabled if name in features}
            tables = [manifest] + list(manifest.get("target", {}).values())
            for table in tables:
                table.pop("dev-dependencies", None)
                for key in ("dependencies", "build-dependencies"):
                    deps = table.get(key, {})
                    for name in list(deps):
                        spec = deps[name]
                        if isinstance(spec, dict) and spec.get("optional") and name not in active:
                            del deps[name]
            return manifest

        sys.exit(0 if shipped(sys.argv[1]) != shipped(sys.argv[2]) else 1)
        EOF
          then
            package=true
          fi
        fi
        echo "package=$package" >> "$GITHUB_OUTPUT"
        echo "Build the packages: $package"

    # The release preflight, also run on pull requests: versions, the tag and
    # the release. GH_TOKEN is only read.
    - name: Check the versions, tag and release
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        state=.github/scripts/release-state.sh
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' gui/Cargo.toml | head -n 1)
        "$state" semver "$version"
        locked=$(awk '/^name = "mpeg-ts-analyzer-gui"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' gui/Cargo.lock)
        if [ "$locked" != "$version" ]; then
          echo "::error::gui/Cargo.lock has version $locked for mpeg-ts-analyzer-gui, gui/Cargo.toml $version"
          exit 1
        fi
        cli_version=$("$state" version gui/BUNDLED_CLI_VERSION)
        tag="gui-v$version"
        case "$EVENT_NAME" in
          pull_request)
            # A GUI version that this pull request changes must not have
            # been released yet.
            base_version=$(git show "$BASE_SHA:gui/Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
            if [ "$version" != "$base_version" ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::error::$tag already exists; choose a new GUI version."
              exit 1
            fi
            release_state=pull-request ;;
          push)
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME does not match gui/Cargo.toml version $version"
              exit 1
            fi
            "$state" on-master "$SHA"
            release_state=$("$state" tag "$tag" "$SHA") ;;
          workflow_dispatch)
            if [ "$REF" != refs/heads/master ]; then
              echo "::error::Release from master only (got $REF)"
              exit 1
            fi
            "$state" on-master "$SHA"
            release_state=$("$state" tag "$tag" "$SHA") ;;
        esac
        if [ "$release_state" = published ]; then
          echo "::notice::$tag is already released from $SHA; nothing to do."
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "state=$release_state" >> "$GITHUB_OUTPUT"
        echo "cli-version=$cli_version" >> "$GITHUB_OUTPUT"
        echo "GUI $version ($tag, $release_state) bundling CLI $cli_version"

  # Provides the bundled CLI for all three targets once, and one notice file
  # for every package: the Rust crates of the GUI and the Go modules recorded
  # in the bundled CLI binaries.
  notices:
    needs: version
    if: needs.version.outputs.state != 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install the toolchain from rust-toolchain.toml
      working-directory: gui
      run: rustup toolchain install

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: './go.mod'

    - name: Restore cargo-about
      id: cargo-about
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-about
        key: cargo-about-${{ runner.os }}-${{ env.CARGO_ABOUT_VERSION }}

    - name: Install cargo-about
      if: steps.cargo-about.outputs.cache-hit != 'true'
      run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli

    - name: Provide the bundled CLI
      env:
        GH_TOKEN: ${{ github.token }}
        ALLOW_STAND_IN: ${{ github.event_name == 'pull_request' }}
      run: .github/scripts/bundled-cli.sh bundled-cli darwin/arm64 linux/amd64 windows/amd64

    - name: Write the notices
      run: |
        mkdir notices
        gui/scripts/third-party-notices.sh notices/THIRD-PARTY-NOTICES.txt bundled-cli

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: notices
        path: notices/
        if-no-files-found: error

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bundled-cli
        path: bundled-cli/
        if-no-files-found: error

  package:
    needs: [version, notices]
    if: needs.version.outputs.package == 'true' && needs.version.outputs.state != 'published'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          formats: app,dmg
        # An older Ubuntu, so the packages run on older glibc.
        - os: ubuntu-22.04
          formats: deb,appimage
        - os: windows-latest
          formats: nsis
          # Links the VC++ runtime statically.
          rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLI_VERSION: ${{ needs.version.outputs.cli-version }}
    steps:
    # The commit the run started on; a release tags it only after this job.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      working-directory: gui
      run: rustup toolchain install

    # The AppImage tooling is itself an AppImage and needs FUSE 2.
    - name: Install AppImage dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libfuse2

    - name: Restore cargo-packager
      id: cargo-packager
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-packager*
        key: cargo-packager-${{ runner.os }}-${{ env.CARGO_PACKAGER_VERSION }}

    - name: Install cargo-packager
      if: steps.cargo-packager.outputs.cache-hit != 'true'
      run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bundled-cli
        path: ${{ runner.temp }}/bundled-cli

    # The CLI verified by the notices job, for this runner's target. It must
    # report the declared version before it is packaged.
    - name: Take the bundled CLI
      run: |
        case "$RUNNER_OS" in
          macOS) target=darwin-arm64 exe= ;;
          Linux) target=linux-amd64 exe= ;;
          Windows) target=windows-amd64 exe=.exe ;;
        esac
        mkdir -p gui/target/bundled-cli
        cp "$RUNNER_TEMP/bundled-cli/$target/mpeg-ts-analyzer$exe" gui/target/bundled-cli/
        chmod +x "gui/target/bundled-cli/mpeg-ts-analyzer$exe"
        actual=$("gui/target/bundled-cli/mpeg-ts-analyzer$exe" --version)
        if [ "$actual" != "mpeg-ts-analyzer version $CLI_VERSION" ]; then
          echo "::error::The bundled CLI reports '$actual', expected version $CLI_VERSION."
          exit 1
        fi
        echo "$actual"

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: notices
        path: gui/target/notices

    - name: Package
      working-directory: gui
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
      run: cargo packager --release --formats "${{ matrix.formats }}"

    - name: Collect the packages
      working-directory: gui/target/release
      run: |
        mkdir -p "$GITHUB_WORKSPACE/dist"
        dist="$GITHUB_WORKSPACE/dist"
        base="mpeg-ts-analyzer-gui_${VERSION}"
        case "$RUNNER_OS" in
          macOS)
            cp ./*.dmg "$dist/${base}_macos_arm64.dmg"
            # The in-app update replaces the installed .app with the top-level
            # directory of this archive: the ad-hoc signed .app, without
            # AppleDouble (._*) files, which would break the bundle's seal.
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$dist/${base}_macos_arm64.app.tar.gz" mpeg-ts-analyzer.app ;;
          Linux)
            cp ./*.deb "$dist/${base}_amd64.deb"
            cp ./*.AppImage "$dist/${base}_linux_x86_64.AppImage" ;;
          Windows)
            cp ./*-setup.exe "$dist/${base}_windows_x86_64_setup.exe"
            portable="$RUNNER_TEMP/${base}_windows_x86_64"
            mkdir "$portable"
            cp mpeg-ts-analyzer-gui.exe ../bundled-cli/mpeg-ts-analyzer.exe ../../../LICENSE ../../assets/fonts/*.txt ../notices/THIRD-PARTY-NOTICES.txt "$portable/"
            (cd "$RUNNER_TEMP" && 7z a -tzip "$dist/${base}_windows_x86_64_portable.zip" "${base}_windows_x86_64" >/dev/null) ;;
        esac
        ls -l "$dist"

    # Each package, as a user would install or unpack it, must find the CLI
    # bundled with it (not one from MPEG_TS_ANALYZER_CLI, Settings or PATH)
    # and carry the license texts.
    - name: Check that each package finds its bundled CLI
      working-directory: dist
      run: |
        unset MPEG_TS_ANALYZER_CLI
        check() {
          echo "$ $*"
          output=$("$@" --check-cli)
          echo "$output"
          case "$output" in
            *"(bundled with the GUI): mpeg-ts-analyzer $CLI_VERSION") ;;
            *) echo "::error::$1 did not find its bundled CLI"; exit 1 ;;
          esac
        }
        licenses() {
          for file in LICENSE THIRD-PARTY-NOTICES.txt Inter-LICENSE.txt JetBrainsMono-OFL.txt Phosphor-LICENSE.txt; do
            [ -f "$1/$file" ] || { echo "::error::$1/$file is missing"; exit 1; }
          done
        }
        # The packaged CLI must be byte for byte the one verified by the
        # notices job (on macOS, signing the .app must not re-sign it).
        same_cli() {
          cmp "$1" "$2" || { echo "::error::$1 differs from the bundled CLI $2"; exit 1; }
        }
        cli="$RUNNER_TEMP/bundled-cli"
        case "$RUNNER_OS" in
          macOS)
            mount="$RUNNER_TEMP/dmg"
            hdiutil attach ./*.dmg -nobrowse -readonly -mountpoint "$mount" < /dev/null
            app="$mount/mpeg-ts-analyzer.app"
            # A downloaded app whose bundle is not signed is reported as
            # "damaged" by macOS; an ad-hoc signed one can be opened anyway.
            codesign --verify --deep --strict --verbose=2 "$app"
            check "$app/Contents/MacOS/mpeg-ts-analyzer-gui"
            licenses "$app/Contents/Resources"
            same_cli "$app/Contents/Resources/mpeg-ts-analyzer" "$cli/darwin-arm64/mpeg-ts-analyzer"
            # The just-started GUI may still hold the volume for a moment.
            hdiutil detach "$mount" -force
            # The update archive, unpacked as the updater does, holds the same
            # signed app.
            update="$RUNNER_TEMP/update"
            mkdir "$update"
            tar -xzf ./*.app.tar.gz -C "$update"
            [ "$(ls "$update")" = mpeg-ts-analyzer.app ] || { echo "::error::The update archive must hold only mpeg-ts-analyzer.app"; exit 1; }
            [ -z "$(find "$update" -name '._*')" ] || { echo "::error::The update archive contains AppleDouble files"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$update/mpeg-ts-analyzer.app"
            check "$update/mpeg-ts-analyzer.app/Contents/MacOS/mpeg-ts-analyzer-gui"
            same_cli "$update/mpeg-ts-analyzer.app/Contents/Resources/mpeg-ts-analyzer" "$cli/darwin-arm64/mpeg-ts-analyzer" ;;
          Linux)
            sudo apt-get install -y ./*.deb
            check /usr/bin/mpeg-ts-analyzer-gui
            licenses /usr/lib/mpeg-ts-analyzer-gui
            same_cli /usr/lib/mpeg-ts-analyzer-gui/mpeg-ts-analyzer "$cli/linux-amd64/mpeg-ts-analyzer"
            appimage=$(ls "$PWD"/*.AppImage)
            chmod +x "$appimage"
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
            check "$RUNNER_TEMP/squashfs-root/AppRun"
            licenses "$RUNNER_TEMP/squashfs-root/usr/lib/mpeg-ts-analyzer-gui" ;;
          Windows)
            installer=$(cygpath -w "$PWD/$(ls ./*_setup.exe)")
            powershell -NoProfile -Command "Start-Process -FilePath '$installer' -ArgumentList '/S' -Wait"
            check "$LOCALAPPDATA/mpeg-ts-analyzer/mpeg-ts-analyzer-gui.exe"
            licenses "$LOCALAPPDATA/mpeg-ts-analyzer"
            same_cli "$LOCALAPPDATA/mpeg-ts-analyzer/mpeg-ts-analyzer.exe" "$cli/windows-amd64/mpeg-ts-analyzer.exe"
            7z x -o"$RUNNER_TEMP/portable" ./*_portable.zip >/dev/null
            portable=$(ls -d "$RUNNER_TEMP"/portable/*/)
            check "${portable}mpeg-ts-analyzer-gui.exe"
            licenses "$portable" ;;
        esac

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gui-${{ runner.os }}
        path: dist/
        if-no-files-found: error

  # Signs the update packages for the in-app update and writes the update
  # manifest (docs/gui/release-security.md, "Update signing"). The only job
  # that uses the gui-release environment, whose secrets hold the signing key;
  # it runs after the version job required the commit to be on master. Its
  # artifact, gui-updates, joins the packages in the release job. Ubuntu 24.04:
  # 22.04 has no minisign package.
  sign-updates:
    needs: [version, package]
    if: >-
      github.event_name != 'pull_request' &&
      needs.version.outputs.state != 'published' &&
      needs.package.result == 'success'
    runs-on: ubuntu-24.04
    environment: gui-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      working-directory: gui
      run: rustup toolchain install

    # Release runs build the tool from source; no cache is restored.
    - name: Install cargo-packager and minisign
      run: |
        cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
        sudo apt-get update && sudo apt-get install -y minisign

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: gui-*
        merge-multiple: true
        path: packages

    - name: Sign the update packages
      env:
        CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.GUI_UPDATER_PRIVATE_KEY }}
        CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.GUI_UPDATER_PRIVATE_KEY_PASSWORD }}
      run: .github/scripts/sign-gui-updates.sh packages "$VERSION" "$TAG" gui/updater.pub updates

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gui-updates
        path: updates/
        if-no-files-found: error

  # The same signing on pull requests, with a key generated here instead of the
  # gui-release environment's, which pull requests never reference. Nothing is
  # uploaded.
  sign-updates-dry-run:
    needs: [version, package]
    if: github.event_name == 'pull_request' && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      working-directory: gui
      run: rustup toolchain install

    # Not the packaging jobs' key: their Linux binary is built on Ubuntu 22.04,
    # and one built here could need a newer glibc than 22.04 has.
    - name: Restore cargo-packager
      id: cargo-packager
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-packager*
        key: cargo-packager-ubuntu-24.04-${{ env.CARGO_PACKAGER_VERSION }}

    - name: Install cargo-packager
      if: steps.cargo-packager.outputs.cache-hit != 'true'
      run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

    - name: Install minisign
      run: sudo apt-get update && sudo apt-get install -y minisign

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: gui-*
        merge-multiple: true
        path: packages

    # The committed key must at least be a public key in cargo-packager's
    # format; whether the release key matches it is checked by sign-updates.
    - name: Check the committed public key
      run: |
        base64 --decode gui/updater.pub | grep -q '^untrusted comment: minisign public key'

    - name: Sign the update packages with a throwaway key
      run: |
        key="$RUNNER_TEMP/throwaway.key"
        CI=true cargo packager signer generate --path "$key"
        CARGO_PACKAGER_SIGN_PRIVATE_KEY=$(cat "$key") \
        CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD='' \
          .github/scripts/sign-gui-updates.sh packages "$VERSION" "$TAG" "$key.pub" "$RUNNER_TEMP/updates"

  release:
    needs: [version, package, sign-updates]
    if: >-
      github.event_name != 'pull_request' &&
      needs.version.outputs.state != 'published' &&
      needs.package.result == 'success' &&
      needs.sign-updates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      CLI_VERSION: ${{ needs.version.outputs.cli-version }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    # The built commit, with the credentials to push its tag.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: gui-*
        merge-multiple: true
        path: dist

    # Every package passed: tag the built commit, unless a previous run did.
    # The state is checked again, since a tag or release may have appeared
    # while the packages were built. A draft left by a failed run is replaced.
    - name: Push the tag
      run: |
        .github/scripts/release-state.sh on-master "$SHA"
        state=$(.github/scripts/release-state.sh tag "$TAG" "$SHA")
        case "$state" in
          new) git tag "$TAG" "$SHA" && git push origin "refs/tags/$TAG" ;;
          resume) echo "$TAG already points at $SHA." ;;
          *) echo "::error::$TAG was published while this run was building."; exit 1 ;;
        esac
        if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
          gh release delete "$TAG" --yes
        fi

    # Which GUI and which published CLI the packages contain.
    - name: Write the manifest
      run: |
        # Peeled, so an annotated tag names its commit, not the tag object.
        git fetch --quiet origin "+refs/tags/v$CLI_VERSION:refs/tags/v$CLI_VERSION"
        cli_commit=$(git rev-parse "v$CLI_VERSION^{commit}")
        cat > "dist/mpeg-ts-analyzer-gui_${VERSION}_manifest.json" <<EOF
        {
          "gui_version": "$VERSION",
          "gui_tag": "$TAG",
          "gui_commit": "$SHA",
          "bundled_cli_version": "$CLI_VERSION",
          "bundled_cli_tag": "v$CLI_VERSION",
          "bundled_cli_commit": "$cli_commit"
        }
        EOF
        cat "dist/mpeg-ts-analyzer-gui_${VERSION}_manifest.json"

    - name: Generate the SBOM
      run: |
        cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
        cargo cyclonedx --manifest-path gui/Cargo.toml --format json --override-filename sbom
        mv gui/sbom.json "dist/mpeg-ts-analyzer-gui_${VERSION}_sbom.cdx.json"

    - name: Write the checksums
      working-directory: dist
      run: sha256sum -- * > SHA256SUMS

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    # Not marked latest: "latest" stays on the CLI release.
    - name: Publish the release
      run: |
        sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{CLI_VERSION}}/$CLI_VERSION/g" .github/gui-release-notes.md > "$RUNNER_TEMP/notes.md"
        gh release create "$TAG" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --latest=false \
          --title "mpeg-ts-analyzer GUI $VERSION (CLI $CLI_VERSION)" \
          --notes-file "$RUNNER_TEMP/notes.md"
