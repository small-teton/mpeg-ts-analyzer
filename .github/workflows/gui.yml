name: GUI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so cargo audit catches advisories published against an unchanged
    # Cargo.lock (no push or pull request would surface them).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:

  # The workflow runs for every pull request so that gui-ci always reports and
  # can be a required check. The GUI jobs run only when GUI-related files
  # changed; a skipped job counts as passing in gui-ci.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gui: ${{ steps.filter.outputs.gui }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Detect GUI changes
      id: filter
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        case "$EVENT_NAME" in
          pull_request) base="$PR_BASE_SHA" ;;
          push) base="$PUSH_BEFORE_SHA" ;;
          *) echo "gui=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        # A new branch or an unknown base: check everything.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "gui=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "$base" HEAD \
          | grep -Eq '^(gui/|Makefile$|mise\.toml$|rust-toolchain\.toml$|renovate\.json$|\.github/workflows/gui\.yml$)'; then
          echo "gui=true" >> "$GITHUB_OUTPUT"
        else
          echo "gui=false" >> "$GITHUB_OUTPUT"
        fi

  lint:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: './go.mod'

    # The GUI's CLI integration tests run against the CLI of the same commit.
    - name: Build the CLI
      working-directory: .
      shell: bash
      run: go build -o "$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" .

    - name: Build and test
      shell: bash
      run: MPEG_TS_ANALYZER_CLI="$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" cargo test --locked

  # RustSec advisories for gui/Cargo.lock. Runs on GUI changes and weekly; the
  # scheduled run covers advisories published while Cargo.lock is unchanged,
  # so unrelated pushes to master do not need to repeat this expensive install.
  # A vulnerability fails the job. Unmaintained, unsound and yanked crates are
  # reported as warnings in the log.
  cargo-audit:
    needs: changes
    if: >-
      needs.changes.outputs.gui == 'true' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install cargo-audit
      run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

    - name: cargo audit
      run: cargo audit --file gui/Cargo.lock

  # On a scheduled run, a cargo-audit failure means a new advisory landed
  # against an unchanged Cargo.lock, so open an issue or comment on the open
  # one. Only this job can write issues.
  cargo-audit-issue:
    needs: cargo-audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open or update the issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const title = 'cargo audit: vulnerabilities detected';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `The scheduled \`cargo audit\` run for \`gui/Cargo.lock\` reported vulnerabilities.\n\nRun: ${runUrl}`;
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security',
          });
          const existing = issues.find(i => i.title === title);
          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['security'],
            });
          }

  # The single check to require in branch protection. It always runs and fails
  # when any GUI job failed or was cancelled.
  gui-ci:
    needs: [changes, lint, test, cargo-audit]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check the GUI jobs
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A GUI job ended with: $result"; exit 1 ;;
          esac
        done
