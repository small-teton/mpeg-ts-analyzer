name: GUI

on:
  push:
    branches: [master]
    paths:
      - "gui/**"
      - "Makefile"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "gui/**"
      - "Makefile"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: './go.mod'

    # The GUI's CLI integration tests run against the CLI of the same commit.
    - name: Build the CLI
      working-directory: .
      shell: bash
      run: go build -o "$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" .

    - name: Build and test
      shell: bash
      run: MPEG_TS_ANALYZER_CLI="$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" cargo test --locked
