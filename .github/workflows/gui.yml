name: GUI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so cargo audit catches advisories published against an unchanged
    # Cargo.lock (no push or pull request would surface them).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:

  # The workflow runs for every pull request so that gui-ci always reports and
  # can be a required check. The GUI jobs run only when GUI-related files
  # changed; a skipped job counts as passing in gui-ci.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gui: ${{ steps.filter.outputs.gui }}
      screenshots: ${{ steps.filter.outputs.screenshots }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Detect GUI changes
      id: filter
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        case "$EVENT_NAME" in
          pull_request) base="$PR_BASE_SHA" ;;
          push) base="$PUSH_BEFORE_SHA" ;;
          *)
            echo "gui=false" >> "$GITHUB_OUTPUT"
            echo "screenshots=false" >> "$GITHUB_OUTPUT"
            echo "lockfile=false" >> "$GITHUB_OUTPUT"
            exit 0 ;;
        esac
        # A new branch or an unknown base: check everything.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "gui=true" >> "$GITHUB_OUTPUT"
          echo "screenshots=true" >> "$GITHUB_OUTPUT"
          echo "lockfile=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$base" HEAD)
        # Here-strings, not pipes: with pipefail, grep -q exiting at the first
        # match could fail the upstream printf with SIGPIPE.
        if grep -Eq '^(gui/Cargo\.lock|\.github/workflows/gui\.yml)$' <<<"$files"; then
          echo "lockfile=true" >> "$GITHUB_OUTPUT"
        else
          echo "lockfile=false" >> "$GITHUB_OUTPUT"
        fi
        if grep -Eq '^(gui/|Makefile$|mise\.toml$|rust-toolchain\.toml$|renovate\.json$|\.github/workflows/gui\.yml$)' \
          <<<"$files"; then
          echo "gui=true" >> "$GITHUB_OUTPUT"
          echo "screenshots=true" >> "$GITHUB_OUTPUT"
        elif grep -Eq '^(docs/images/gui-|README\.md$)' <<<"$files"; then
          # The committed images or the README that shows them changed.
          echo "gui=false" >> "$GITHUB_OUTPUT"
          echo "screenshots=true" >> "$GITHUB_OUTPUT"
        else
          echo "gui=false" >> "$GITHUB_OUTPUT"
          echo "screenshots=false" >> "$GITHUB_OUTPUT"
        fi

  lint:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    # Dependencies only; the GUI crate itself is always rebuilt. Only master
    # saves, so pull requests restore master's cache and do not evict it.
    - name: Restore the Rust build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: gui
        key: ${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Clippy with the screenshots feature
      run: cargo clippy --all-targets --locked --features screenshots -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    # Dependencies only; the GUI crate itself is always rebuilt. Only master
    # saves, so pull requests restore master's cache and do not evict it.
    - name: Restore the Rust build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: gui
        key: ${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: './go.mod'

    # The GUI's CLI integration tests run against the CLI of the same commit.
    - name: Build the CLI
      working-directory: .
      shell: bash
      run: go build -o "$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" .

    - name: Build and test
      shell: bash
      run: MPEG_TS_ANALYZER_CLI="$RUNNER_TEMP/mpeg-ts-analyzer$(go env GOEXE)" cargo test --locked

  # The README screenshots (docs/images/gui-*.png) must match a fresh rendering.
  # macOS is the canonical renderer, so the images are only checked here; the
  # semantic UI tests run on all three systems in the test job.
  screenshots:
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install the toolchain from rust-toolchain.toml
      run: rustup toolchain install

    # Dependencies only; the GUI crate itself is always rebuilt. Only master
    # saves, so pull requests restore master's cache and do not evict it.
    - name: Restore the Rust build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: gui
        key: ${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Check the README screenshots
      run: cargo test --locked --features screenshots readme_screenshots

    # On a mismatch, the new renderings and their differences are kept for
    # review. CI never commits them: run `make gui-screenshots` instead.
    - name: Upload the new renderings
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gui-screenshots
        path: |
          gui/target/screenshots/*.new.png
          gui/target/screenshots/*.diff.png
        if-no-files-found: ignore

  # RustSec advisories for gui/Cargo.lock. The advisories concern the locked
  # dependencies, so this runs when Cargo.lock (or this workflow) changes and
  # weekly; the scheduled run covers advisories published while Cargo.lock is
  # unchanged. A vulnerability fails the job. Unmaintained, unsound and yanked
  # crates are reported as warnings in the log.
  cargo-audit:
    needs: changes
    if: >-
      needs.changes.outputs.lockfile == 'true' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Restore cargo-audit
      id: cargo-audit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

    - name: Install cargo-audit
      if: steps.cargo-audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

    - name: cargo audit
      run: cargo audit --file gui/Cargo.lock

  # On a scheduled run, a cargo-audit failure means a new advisory landed
  # against an unchanged Cargo.lock, so open an issue or comment on the open
  # one. Only this job can write issues.
  cargo-audit-issue:
    needs: cargo-audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open or update the issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const title = 'cargo audit: vulnerabilities detected';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `The scheduled \`cargo audit\` run for \`gui/Cargo.lock\` reported vulnerabilities.\n\nRun: ${runUrl}`;
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security',
          });
          const existing = issues.find(i => i.title === title);
          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['security'],
            });
          }

  # The single check to require in branch protection. It always runs and fails
  # when any GUI job failed or was cancelled.
  gui-ci:
    needs: [changes, lint, test, screenshots, cargo-audit]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check the GUI jobs
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A GUI job ended with: $result"; exit 1 ;;
          esac
        done
