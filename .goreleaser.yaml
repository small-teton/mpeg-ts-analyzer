version: 2

project_name: mpeg-ts-analyzer

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
    # The licenses of the Go standard library and the modules compiled into
    # the binaries, for every port of the GOOS values built below (a superset
    # of the GOARCH values GoReleaser builds). Written outside dist/, which
    # --clean removes, and byte-identical for the same commit and toolchain.
    - mkdir -p out/release
    - sh -c '.github/scripts/go-third-party-notices.sh "Third-party software in the mpeg-ts-analyzer CLI" linux windows darwin > out/release/THIRD-PARTY-NOTICES.txt'

builds:
  - env:
      - CGO_ENABLED=0
    # Keep in sync with the notices hook above.
    goos:
      - linux
      - windows
      - darwin
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Reproducible output: the release workflows build once to validate and
    # again to publish, and require both builds to have the same checksums.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: out/release/THIRD-PARTY-NOTICES.txt
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - package_name: mpeg-ts-analyzer
    homepage: "https://github.com/small-teton/mpeg-ts-analyzer"
    description: "An analyzer for MPEG-2 Transport Stream (ISO/IEC 13818-1)"
    license: "Apache-2.0"
    maintainer: "Masahiko Matsuura"
    mtime: "{{ .CommitDate }}"
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/mpeg-ts-analyzer/LICENSE
        file_info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: out/release/THIRD-PARTY-NOTICES.txt
        dst: /usr/share/doc/mpeg-ts-analyzer/THIRD-PARTY-NOTICES.txt
        file_info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

homebrew_casks:
  - repository:
      owner: small-teton
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/small-teton/mpeg-ts-analyzer"
    description: "An analyzer for MPEG-2 Transport Stream (ISO/IEC 13818-1)"
    license: "Apache-2.0"

# The Release workflow uploads to a draft and publishes it only after
# comparing the checksums with the build it checked. A rerun after a failed
# upload replaces the draft and its assets.
release:
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
