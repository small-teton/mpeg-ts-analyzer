services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    stdin_open: true
    tty: true

volumes:
  go-build-cache:
  go-mod-cache:
