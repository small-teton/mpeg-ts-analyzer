[package]
name = "mpeg-ts-analyzer-gui"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Desktop GUI for mpeg-ts-analyzer"
license = "Apache-2.0"
repository = "https://github.com/small-teton/mpeg-ts-analyzer"
publish = false

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_plot = "0.38.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# In-app update (docs/gui/design.md, "Updates"): checks GitHub Releases,
# verifies the minisign signature and installs; its reqwest (rustls with the
# OS's root certificates) is also used for the release lookups.
cargo-packager-updater = "0.2.3"
# The GUI downloads and verifies the package itself (redirects restricted to
# GitHub); the versions cargo-packager-updater uses.
minisign-verify = "0.3.0"
base64 = "0.23.0"
# Opens the repository page for the star reminder and reports whether the
# browser started (egui's open_url does not); already used by eframe.
webbrowser = "1.2.6"
# Only for the screenshots feature; the same version as egui_kittest uses.
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
egui_kittest = "0.37.0"

# Rendering the README screenshots (make gui-screenshots) needs a GPU renderer
# and image output, which the semantic UI tests do not; they stay out of
# ordinary builds and tests.
[features]
screenshots = ["egui_kittest/wgpu", "egui_kittest/snapshot", "dep:image"]

# Packages for `gui-release.yml` (cargo-packager). The CLI is bundled from
# target/bundled-cli/: releases fill it with the published CLI release named in
# BUNDLED_CLI_VERSION, and make gui-package with a CLI built from this tree.
[package.metadata.packager]
product-name = "mpeg-ts-analyzer"
identifier = "io.github.small-teton.mpeg-ts-analyzer"
description = "Desktop GUI for mpeg-ts-analyzer, an MPEG-2 Transport Stream analyzer"
homepage = "https://github.com/small-teton/mpeg-ts-analyzer"
authors = ["Masahiko Matsuura"]
publisher = "small-teton"
category = "DeveloperTool"
# No license-file: cargo-packager would show it as an agreement to accept in
# the .dmg and the installer, which Apache-2.0 does not need. The license texts
# are shipped as resources instead, next to the bundled CLI, with the notices of
# the Rust crates and Go modules (gui/scripts/third-party-notices.sh).
before-packaging-command = "cargo build --release --locked"
# Signs the .app ad hoc before the .dmg is made (scripts/sign-macos-app.sh; it
# does nothing for the other formats). Run through sh, since cargo-packager
# runs the hook with cmd on Windows.
before-each-package-command = "sh scripts/sign-macos-app.sh"
icons = [
  "assets/icons/32x32.png",
  "assets/icons/64x64.png",
  "assets/icons/128x128.png",
  "assets/icons/256x256.png",
  "assets/icons/512x512.png",
  "assets/icons/1024x1024.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]
resources = [
  "target/bundled-cli/*",
  "target/notices/THIRD-PARTY-NOTICES.txt",
  "../LICENSE",
  "assets/fonts/*.txt",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
# Not mpeg-ts-analyzer: that is the CLI's own package.
package-name = "mpeg-ts-analyzer-gui"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
