# cargo-about configuration for the third-party notices shipped in the GUI
# packages (gui-release.yml). Licenses are preferred in this order where a
# crate offers a choice.
#
# `accepted` is also the license allowlist of the License check workflow
# (license-check.yml): gui/deny.toml must allow the same licenses
# (.github/scripts/license-allowlist.py check), and the Go modules of the CLI
# may use any of them except MPL-2.0, which is granted to option-ext only.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # File-level copyleft; only option-ext (dirs, from cargo-packager-updater)
  # uses it. Used unmodified, with its license text in the notices and its
  # source on crates.io.
  "MPL-2.0",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
